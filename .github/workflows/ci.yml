# CI — every push and pull request must pass the full verification chain.
# Mirrors the local gates exactly: Convex codegen (regenerates _generated
# types before anything typechecks against them), TypeScript, ESLint, Vitest.
#
# Convex codegen talks to the linked dev deployment. On forks without the
# CONVEX_DEPLOY_KEY secret, that step is skipped and typechecking falls back
# to the committed _generated files — the suite still runs, just against the
# last pushed types.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Convex codegen (skipped without a deploy key)
        if: ${{ env.CONVEX_DEPLOY_KEY != '' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex dev --once

      - name: Typecheck
        run: bun tsc -b --noEmit

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test
